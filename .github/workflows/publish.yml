name: Publish Docker images (manual)
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Approved full 40-character commit SHA from main'
        required: true
        type: string
      publish_latest:
        description: 'Also move latest to this tested image'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ghcr-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select the approved main commit
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full lowercase commit SHA'; exit 1; }
          [[ "$(git rev-parse "$APPROVED_COMMIT^{commit}")" == "$APPROVED_COMMIT" ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" origin/main
          git checkout --detach "$APPROVED_COMMIT"
          printf 'RELEASE_SHA=%s\n' "$APPROVED_COMMIT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Build the Linux amd64 image
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release version'; exit 1; }
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg APP_VERSION="$version" --build-arg VCS_REF="$RELEASE_SHA" -t tdarr-review:smoke .
      - name: Test the exact image before publication
        run: bash tools/docker-smoke.sh
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested image
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tdarr-review"
          for tag in "sha-$RELEASE_SHA" "$RELEASE_VERSION"; do
            docker tag tdarr-review:smoke "$image:$tag"
            docker push "$image:$tag"
            printf 'Published `%s:%s`\n' "$image" "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$PUBLISH_LATEST" == true ]]; then
            docker tag tdarr-review:smoke "$image:latest"
            docker push "$image:latest"
            printf 'Updated `%s:latest`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
