name: Tests and Docker smoke
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run check
      - name: Run the complete suite and report Node coverage
        run: npm run test:coverage
  docker-test:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build both Linux amd64 images
        run: |
          docker build --platform linux/amd64 -t tdarr-review:smoke .
          docker build --platform linux/amd64 -f Dockerfile.recovery -t tdarr-recovery:smoke .
      - name: Test images without production data or external network
        run: bash tools/docker-smoke.sh
