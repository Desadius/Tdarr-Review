name: Tests and Docker smoke
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run check
      - name: Type-check JSDoc-annotated modules (pinned dev-only TypeScript)
        run: npm run typecheck
      - name: Run the complete suite and report Node coverage
        run: npm run test:coverage
  docker-test:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Preload the isolated Node 24 test image
        run: docker pull --platform linux/amd64 node:24
      - name: Run the developer suite with a read-only repository and no network
        run: npm run test:docker
      - name: Build the Linux amd64 image
        run: docker build --platform linux/amd64 -t tdarr-review:smoke .
      - name: Test images without production data or external network
        run: bash tools/docker-smoke.sh
