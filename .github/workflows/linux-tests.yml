name: Linux tests (manual)
on:
  workflow_dispatch:
    inputs:
      files:
        description: Suite files to run, separated by spaces (empty runs the whole suite)
        required: false
        default: ''
      name_pattern:
        description: Run only tests whose name matches this regular expression (empty runs all)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Run the selected tests
        env:
          TEST_FILES: ${{ inputs.files }}
          TEST_NAME_PATTERN: ${{ inputs.name_pattern }}
        run: node tools/test-select.mjs
