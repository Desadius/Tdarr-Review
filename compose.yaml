services:
  review:
    build: .
    image: "ghcr.io/desadius/tdarr-review:${REVIEW_IMAGE_TAG:-latest}"
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "${REVIEW_BIND_IP:-127.0.0.1}:${REVIEW_PORT:-8270}:8270"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8270}"
      TDARR_URL: "${TDARR_URL:?Set TDARR_URL in .env}"
      MEDIA_ROOT: /media/movies
      REVIEW_ROOT: /review
      # off (default), verify or repair; verify and repair need /data/recovery/config.json.
      RECOVERY_MODE: "${RECOVERY_MODE:-off}"
    volumes:
      - "${REVIEW_DATA_HOST:?Set REVIEW_DATA_HOST}:/data"
      - "${MEDIA_HOST:?Set MEDIA_HOST}:/media"
      - "${REVIEW_HOST:?Set REVIEW_HOST}:/review"
      - "${TDARR_DB_HOST:?Set TDARR_DB_HOST}:/tdarr:ro"
      # Optional narrower TV mappings. Define these host variables in .env and
      # save the matching /tv-media, /tv-review, /tv-quarantine and
      # /tdarr-tv-reports paths in the inactive TV library draft.
      # - "${TV_MEDIA_HOST}:/tv-media:ro"
      # - "${TV_REVIEW_HOST}:/tv-review:rw"
      # - "${TV_QUARANTINE_HOST}:/tv-quarantine:rw"
      # - "${TDARR_TV_REPORTS_HOST}:/tdarr-tv-reports:ro"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
